<!DOCTYPE html>
<html>

<head>
    <title>ColdCraft</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Loading Spinner Styling */
        .loader-container {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #4f46e5;
            font-weight: bold;
        }

        /* AI Warning Styling */
        .ai-warning {
            color: #dc2626;
            /* Red color */
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            display: block;
            text-align: center;
        }
    </style>
</head>

<nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <a href="/">
                <h3>ColdCraft</h3>
            </a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link active">Home</a>
            <a href="/email" class="nav-link">Generate Email</a>
            <a href="/about" class="nav-link">About</a>
        </div>
    </div>
</nav>
<div class="container">
    <h2>ColdCraft Generator</h2>

    <input id="name" placeholder="Your Name" required>
    <input id="recipientName" placeholder="Recipient Name" required>
    <input id="fieldOfStudy" placeholder="Field of Study" required>
    <input id="school" placeholder="School / University" required>
    <input id="purpose" placeholder="Purpose (research / internship)" required>

    <select id="tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="formal">Formal</option>
    </select>

    <button id="genBtn" onclick="generate()" disabled>Generate Email</button>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">AI is crafting your email...</div>
    </div>

    <div id="result-container" style="display:none; margin-top:30px; border-top: 1px solid #eee; padding-top:20px;">
        <h3>Generated Email</h3>
        <button onclick="copyEmail()"
            style="background-color: #6366f1; padding: 8px 15px; font-size: 14px; margin-bottom: 10px;">
            📋 Copy to Clipboard
        </button>
        <pre id="result"></pre>

        <span class="ai-warning">! Warning: Emails generated by this AI are suggestions and may require editing for
            accuracy and personalization before use.</span>
    </div>

    <script>
        // Function to check if all required fields are filled
        function checkFormValidity() {
            const name = document.getElementById("name").value.trim();
            const recipientName = document.getElementById("recipientName").value.trim();
            const fieldOfStudy = document.getElementById("fieldOfStudy").value.trim();
            const school = document.getElementById("school").value.trim();
            const purpose = document.getElementById("purpose").value.trim();

            const genBtn = document.getElementById("genBtn");

            if (name && recipientName && fieldOfStudy && school && purpose) {
                genBtn.disabled = false;
                genBtn.style.opacity = "1";
                genBtn.style.cursor = "pointer";
            } else {
                genBtn.disabled = true;
                genBtn.style.opacity = "0.5";
                genBtn.style.cursor = "not-allowed";
            }
        }

        // Add event listeners to all input fields
        document.addEventListener('DOMContentLoaded', function () {
            const inputs = ['name', 'recipientName', 'fieldOfStudy', 'school', 'purpose'];
            inputs.forEach(id => {
                const element = document.getElementById(id);
                element.addEventListener('input', checkFormValidity);
                element.addEventListener('change', checkFormValidity);
            });

            // Initial check
            checkFormValidity();
        });

        async function generate() {
            const btn = document.getElementById("genBtn");
            const loader = document.getElementById("loader");
            const resultContainer = document.getElementById("result-container");
            const resultArea = document.getElementById("result");

            resultContainer.style.display = "none";
            loader.style.display = "block";
            btn.disabled = true;
            btn.style.opacity = "0.5";

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("name").value,
                        recipientName: document.getElementById("recipientName").value,
                        fieldOfStudy: document.getElementById("fieldOfStudy").value,
                        school: document.getElementById("school").value,
                        purpose: document.getElementById("purpose").value,
                        tone: document.getElementById("tone").value
                    })
                });

                const data = await response.json();
                resultArea.innerText = data.email;

                loader.style.display = "none";
                resultContainer.style.display = "block";
            } catch (error) {
                loader.style.display = "none";
                alert("Error connecting to the server.");
            } finally {
                // Re-enable button and check form validity
                checkFormValidity();
            }
        }

        function copyEmail() {
            const text = document.getElementById("result").innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied to clipboard!");
            });
        }
    </script>

    <br>
    <div style="text-align:center;">
        <a href="/"><button style="background-color:#10b981;">Back Home</button></a>
    </div>
</div>
</body>

</html>
